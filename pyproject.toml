[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nseuniverse"
version = "1.0.0"
description = "Institutional Point-in-Time Python Client for the Entire National Stock Exchange (NSE) Universe"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "sweeza" }
]
keywords = ["nse", "quantitative-finance", "backtesting", "point-in-time", "nifty", "stocks", "market-data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent"
]
dependencies = [
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "pyarrow>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/sweeza/NSE-PIT-Universe"
Repository = "https://github.com/sweeza/NSE-PIT-Universe"
