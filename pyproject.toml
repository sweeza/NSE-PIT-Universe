[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nseuniverse"
version = "3.0.0"
description = "Point-in-time historical market-data infrastructure for the National Stock Exchange (NSE)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "sweeza" }
]
keywords = ["nse", "quantitative-finance", "backtesting", "point-in-time", "nifty", "market-data"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=12.0.0",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
pdf = ["pymupdf>=1.24"]

[project.scripts]
nseuniverse = "nseuniverse.cli:main"

[tool.setuptools.packages.find]
include = ["nseuniverse*"]

[project.urls]
Homepage = "https://github.com/sweeza/NSE-PIT-Universe"
Repository = "https://github.com/sweeza/NSE-PIT-Universe"
