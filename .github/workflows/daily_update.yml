name: tests
# The old scheduled data update referenced scripts that no longer exist. Daily updates are deferred
# until `nseuniverse fetch` + `build` + `verify` have run clean over a longer period.
on:
  workflow_dispatch:
  push:
    branches: [rebuild, main]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .[dev]
      - run: pytest -q
