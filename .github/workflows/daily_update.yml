name: Daily NSE Universe Update & Validation

on:
  schedule:
    # 7:00 PM IST is 1:30 PM UTC (Monday - Friday)
    - cron: '30 13 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-universe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Universe Update & Pre-Commit Validation
        run: |
          python update_universe_daily.py

      - name: Commit and Push Updated Tensors
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tensors/*.parquet data/metadata/*.parquet data/validation_report.json
          if git diff --staged --quiet; then
            echo "No new updates to commit."
          else
            git commit -m "chore(daily-sync): append $(date +'%Y-%m-%d') session & pass validation gate [skip ci]"
            git push
          fi
